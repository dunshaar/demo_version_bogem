<!doctype html>

  <link rel="preload" href="../assets/fonts/manrope-hero-variable.ttf" as="font" type="font/ttf" crossorigin>

<body class="ny-page">
  <a class="ny-home" href="../">НА ГЛАВНУЮ</a>

  <main class="ny-stage" aria-labelledby="ny-title">
    <div class="ny-scene">
      <header class="ny-heading">
        <p class="ny-season">НОВЫЙ ГОД 2027</p>
        <div class="ny-brand" role="img" aria-label="БОГЕМА">
          <svg viewBox="-1 0 5776 1104" aria-hidden="true" focusable="false">
            <use href="../assets/hero-wordmark.svg#wordmark"/>
          </svg>
        </div>
      </header>

      <figure class="ny-photo">
        <img src="assets/bogema-left-shadows.png" width="1382" height="1138" fetchpriority="high"

    <section class="ny-program" aria-labelledby="ny-title">
      <h1 id="ny-title"><span>НОВОГОДНЯЯ</span> <span>ПРОГРАММА</span></h1>
      <a class="ny-date" href="../#contact"
        aria-describedby="ny-date-description" title="Перейти к контактам группы на главной странице">
        ПРОВЕРИТЬ СВОБОДНУЮ ДАТУ

      <p class="ny-sr-only" id="ny-date-description">Свободную дату уточняет представитель группы Алексей. Ссылка ведёт к контактам на главной странице.</p>
